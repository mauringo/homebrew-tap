name: Cask checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  cask:
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Tap the checked-out cask
        run: brew tap --custom-remote mauringo/tap "$GITHUB_WORKSPACE"
      - name: Check cask style
        run: brew style --cask mauringo/tap/clipboard-assistant
      - name: Read cask metadata
        run: brew info --cask --json=v2 mauringo/tap/clipboard-assistant
      - name: Verify release download and checksum
        run: brew fetch --cask mauringo/tap/clipboard-assistant
